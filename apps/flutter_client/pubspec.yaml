name: lexair_geo
description: "LEXAIR GEO — cliente GIS offline de Villa Clara (Studio Lexair)"
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1 <4.0.0'

# Versiones fijadas (sin rangos) para builds reproducibles. No actualizar
# automáticamente: ver docs/ARCHITECTURE.md › Política de dependencias.
dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  latlong2: 0.10.1
  http: 1.6.0
  provider: 6.1.5+1
  file_picker: 13.4.1
  shared_preferences: 2.5.6
  web: 1.1.2
  path: ^1.9.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/branding/
  # Fuentes empaquetadas (OFL 1.1, ver assets/fonts/OFL.txt): Flutter Web no
  # descarga Roboto ni fuentes de respaldo de fonts.gstatic.com.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono-Regular.ttf
    # Alias interno: el motor web (CanvasKit/Skwasm) necesita una familia «Roboto»
    # como respaldo por defecto y, si no está empaquetada, la descarga de Internet.
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
