# LEXAIR GEO · PostgreSQL para servidor único de 8 GB (API + Nginx + mosaicos).
# Presupuesto: PG ~3 GB efectivos, API ≤900 MB, mosaicos ≤400 MB, SO/caché resto.
listen_addresses = 'localhost'
max_connections = 60                 # API pool 12-20 + mantenimiento
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB
random_page_cost = 1.1               # SSD
effective_io_concurrency = 200
default_statistics_target = 200
jit = off                            # consultas cortas: JIT solo añade latencia
statement_timeout = 0                # el API fija su propio límite por sesión
idle_in_transaction_session_timeout = 60s
log_min_duration_statement = 1000    # solo consultas lentas; sin parámetros
log_parameter_max_length = 0         # nunca registrar valores (datos personales)
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %u@%d '
