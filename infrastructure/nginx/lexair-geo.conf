# LEXAIR GEO · Nginx (LAN interna, HTTPS con CA privada).
# Plantilla: el instalador sustituye __SERVER_NAME__ y __WEB_ROOT__.
limit_req_zone $binary_remote_addr zone=lexair_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lexair_api:10m rate=30r/s;

upstream lexair_api   { server 127.0.0.1:3000; keepalive 16; }
upstream lexair_tiles { server 127.0.0.1:8081; keepalive 16; }

proxy_cache_path /var/cache/nginx/lexair_tiles levels=1:2 keys_zone=lexair_tiles:20m
                 max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    # Solo para descargar el certificado de la CA en equipos nuevos.
    location = /ca/lexair-geo-ca.crt { alias /etc/lexair-geo/pki/ca.crt; default_type application/x-x509-ca-cert; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/lexair-geo/pki/server.fullchain.crt;
    ssl_certificate_key /etc/lexair-geo/pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lexair_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 25m;   # importación CSV
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Sin recursos externos: todo procede del propio servidor.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/csv image/svg+xml application/wasm;

    location = /api/v1/auth/login {
        limit_req zone=lexair_login burst=5 nodelay;
        proxy_pass http://lexair_api;
        include /etc/lexair-geo/nginx-proxy.conf;
    }

    location /api/ {
        limit_req zone=lexair_api burst=60 nodelay;
        proxy_pass http://lexair_api;
        include /etc/lexair-geo/nginx-proxy.conf;
        proxy_read_timeout 120s;   # exportaciones CSV
    }

    location /tiles/ {
        proxy_pass http://lexair_tiles;
        include /etc/lexair-geo/nginx-proxy.conf;
        proxy_cache lexair_tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /ca/ { alias /etc/lexair-geo/pki/; location ~ \.key$ { deny all; } autoindex off; }

    root __WEB_ROOT__;
    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/lexair-geo/nginx-headers.conf; }
    location = /config.json { add_header Cache-Control "no-cache" always; include /etc/lexair-geo/nginx-headers.conf; }
    location / { try_files $uri $uri/ /index.html; }
}
