# Solo diagnóstico: inspecciona visualmente el instalador ya construido en CI.
name: diagnostico-instalador
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de la ejecución Windows que produjo el instalador'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  capturas:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lexair-geo-windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: instalador
      - name: Capturar asistente visible
        shell: pwsh
        run: ./scripts/windows/capture-installer.ps1
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigia-instalador-capturas
          path: ${{ runner.temp }}/vigia-setup-*.png
          if-no-files-found: error
          retention-days: 7
