# VIGÍA · Cliente Windows «todo en uno»: la app trae servidor integrado
# (PostgreSQL 17 + PostGIS + Node.js + API) y levanta todo al arrancar.
# Produce ZIP portable completo e instalador offline con tarea opcional.
name: build-windows
on:
  push:
    branches: [main]
    paths: ['apps/flutter_client/**', 'services/api/**', 'services/tile_service/**', 'scripts/maps/**', 'datos/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Compilar solo el instalador de servidor para diagnóstico (no publicar)'
        type: boolean
        default: false
      mapa_run:
        description: 'Opcional: ID de una ejecución con paquete cartográfico completo ya generado'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read

jobs:
  mapa:
    if: ${{ !inputs.mapa_run }}
    uses: ./.github/workflows/build-map.yml
    with:
      maxzoom: '16'

  windows:
    needs: mapa
    if: ${{ !cancelled() && (needs.mapa.result == 'success' || (inputs.mapa_run && needs.mapa.result == 'skipped')) }}
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/flutter_client
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compilar cliente con la versión del proyecto
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ('${{ inputs.version }}' -and '${{ inputs.version }}' -ne $ver) { throw 'La versión de release no coincide con pubspec.yaml' }
          flutter build windows --release "--dart-define=APP_VERSION=$ver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Compilar API (dist + dependencias de producción)
        working-directory: services/api
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Descargar PostgreSQL 17 + PostGIS y verificarlos en vivo
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'vigia-pg'
          New-Item -ItemType Directory -Force $tmp | Out-Null

          # PostgreSQL oficial (binarios zip de EnterpriseDB)
          $pgZip = Join-Path $tmp 'pg-binaries.zip'
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-17.5-1-windows-x64-binaries.zip' -OutFile $pgZip
          Expand-Archive $pgZip (Join-Path $tmp 'root')
          $pg = Join-Path $tmp 'root\pgsql'
          if (-not (Test-Path "$pg\bin\initdb.exe")) { throw 'initdb no está en los binarios' }

          # PostGIS oficial (paquete zip de OSGeo para pg17)
          $gisZip = Join-Path $tmp 'postgis.zip'
          Invoke-WebRequest 'https://download.osgeo.org/postgis/windows/pg17/postgis-bundle-pg17-3.7.0x64.zip' -OutFile $gisZip
          Expand-Archive $gisZip (Join-Path $tmp 'postgis')
          $ctrl = Get-ChildItem (Join-Path $tmp 'postgis') -Recurse -Filter postgis.control | Select-Object -First 1
          if (-not $ctrl) { throw 'postgis.control no encontrado en el paquete' }
          # ...\payload\share\extension\postgis.control → raíz del payload (que contiene bin/ y share/)
          $payload = $ctrl.Directory.Parent.Parent.FullName
          if (-not (Test-Path (Join-Path $payload 'bin'))) { $payload = $ctrl.Directory.Parent.FullName }
          if (-not (Test-Path (Join-Path $payload 'bin'))) { throw "raíz del payload PostGIS no identificada: $($ctrl.FullName)" }
          Write-Host "Payload PostGIS: $payload"
          Copy-Item "$payload\*" $pg -Recurse -Force
          # Dependencias ausentes en instalaciones limpias. Paquetes x64 de
          # MSYS2 fijados por versión y SHA-256; conservar sus licencias MIT.
          $deps = @(
            @{ File='mingw-w64-x86_64-brotli-1.2.1-1-any.pkg.tar.zst'; Hash='3163fae24021624b49d3372a6a7fe05c0f3e01b301e65fcbcb3a95557019fb2d' },
            @{ File='mingw-w64-x86_64-nghttp2-1.71.0-1-any.pkg.tar.zst'; Hash='e868085eed6dd47d81fe19e5048477f8ca0dcc8b8bd3b74a8181b063b6609c6f' }
          )
          $msys = Join-Path $tmp 'msys-deps'
          New-Item -ItemType Directory -Force $msys | Out-Null
          foreach ($dep in $deps) {
            $archive = Join-Path $tmp $dep.File
            Invoke-WebRequest "https://repo.msys2.org/mingw/mingw64/$($dep.File)" -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $dep.Hash) { throw "SHA incorrecto: $($dep.File)" }
            tar.exe -xf $archive -C $msys
            if ($LASTEXITCODE -ne 0) { throw "No se pudo extraer $($dep.File)" }
          }
          foreach ($dll in 'libbrotlidec.dll','libbrotlicommon.dll','libnghttp2-14.dll') {
            $src = Join-Path $msys "mingw64\bin\$dll"
            if (-not (Test-Path $src)) { throw "Falta dependencia: $dll" }
            Copy-Item $src (Join-Path "$pg\bin" $dll) -Force
          }
          New-Item -ItemType Directory -Force "$pg\licenses\brotli","$pg\licenses\nghttp2" | Out-Null
          Copy-Item "$msys\mingw64\share\licenses\brotli\LICENSE" "$pg\licenses\brotli\LICENSE"
          Copy-Item "$msys\mingw64\share\licenses\nghttp2\COPYING" "$pg\licenses\nghttp2\COPYING"
          if (-not (Test-Path "$pg\share\extension\postgis.control")) { throw 'postgis.control no quedó en share/extension' }

          # Prueba real: clúster temporal + CREATE EXTENSION postgis
          $test = Join-Path $tmp 'cluster'
          & "$pg\bin\initdb.exe" -D $test -U lexair -A trust -E UTF8 --locale=C | Out-Null
          & "$pg\bin\pg_ctl.exe" -D $test -o "-p 5599" -l "$tmp\pg.log" -w start
          if ($LASTEXITCODE -ne 0) { throw 'pg_ctl start falló' }
          & "$pg\bin\createdb.exe" -h 127.0.0.1 -p 5599 -U lexair postgis_test | Out-Null
          $ver = (& "$pg\bin\psql.exe" -h 127.0.0.1 -p 5599 -U lexair -d postgis_test -tAc "CREATE EXTENSION postgis; SELECT postgis_full_version();") -join ' '
          & "$pg\bin\pg_ctl.exe" -D $test -w -m fast stop | Out-Null
          if ($ver -notmatch 'POSTGIS="?3') { throw "PostGIS no funciona en el paquete: $ver" }
          Write-Host "PostgreSQL+PostGIS verificados: $ver"
          "$pg" | Out-File -Encoding ascii $env:RUNNER_TEMP\pg-dir.txt

      - name: Descargar cartografía generada en esta ejecución
        if: ${{ !inputs.mapa_run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete-cartografico-${{ github.run_number }}
          path: ${{ runner.temp }}/paquete-cartografico

      - name: Recuperar cartografía completa de una ejecución anterior
        if: ${{ inputs.mapa_run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: paquete-cartografico-*
          merge-multiple: true
          run-id: ${{ inputs.mapa_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/paquete-cartografico

      - name: Montar paquete del servidor integrado
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'apps\flutter_client\build\windows\x64\runner\Release'
          $pg  = (Get-Content $env:RUNNER_TEMP\pg-dir.txt -Raw).Trim()
          $srv = Join-Path $rel 'servidor'
          New-Item -ItemType Directory -Force "$srv\node","$srv\api","$srv\sql","$srv\mapa","$srv\tiles","$rel\datos_ejemplo" | Out-Null

          # PostgreSQL + PostGIS verificados
          Copy-Item $pg "$srv\pg" -Recurse
          # Node.js oficial verificado por SHA-256
          $nodeZip = Join-Path $env:RUNNER_TEMP 'node.zip'
          Invoke-WebRequest 'https://nodejs.org/dist/v26.13.1/node-v26.13.1-win-x64.zip' -OutFile $nodeZip
          $shas = (Invoke-WebRequest 'https://nodejs.org/dist/v26.13.1/SHASUMS256.txt').Content
          if ($shas -notmatch '([0-9a-f]{64})\s+node-v26\.13\.1-win-x64\.zip') { throw 'SHA de node no encontrado' }
          if ((Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw 'SHA-256 de node.zip no coincide' }
          Expand-Archive $nodeZip (Join-Path $env:RUNNER_TEMP 'nodedist')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'nodedist\node-v26.13.1-win-x64\node.exe') "$srv\node\node.exe"
          # API compilado + catálogo + documentación + datos de ejemplo
          Copy-Item 'services\api\dist' "$srv\api\dist" -Recurse
          Copy-Item 'services\api\node_modules' "$srv\api\node_modules" -Recurse
          Copy-Item 'services\api\package.json','services\api\package-lock.json' "$srv\api\"
          Copy-Item 'database\migrations' "$srv\sql\migrations" -Recurse
          Copy-Item 'datos\catalogo_vc\cargar_catalogo.sql' "$srv\sql\cargar_catalogo.sql"
          Copy-Item 'apps\flutter_client\windows\servidor\LEEME.txt' "$srv\LEEME.txt"
          Copy-Item 'apps\flutter_client\windows\servidor\terminologia.ejemplo.json' "$srv\terminologia.ejemplo.json"
          # Solo paquetes reales, íntegros, producidos por el job de mapas de esta ejecución.
          $maps = Join-Path $env:RUNNER_TEMP 'paquete-cartografico\mappkg'
          $manifest = Get-Content (Join-Path $maps 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.isSynthetic -ne $false -or $manifest.styles.Count -ne 3 -or $manifest.maxzoom -lt 16) { throw 'Paquete cartográfico inválido' }
          foreach ($style in $manifest.styles) {
            if ($style.file -notmatch '^[a-z0-9_]+\.mbtiles$' -or $style.sha256 -notmatch '^[a-f0-9]{64}$') { throw 'Archivo cartográfico inválido' }
            $file = Join-Path $maps $style.file
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLower() -ne $style.sha256) { throw "SHA-256 incorrecto: $file" }
            Copy-Item -LiteralPath $file -Destination "$srv\mapa\"
          }
          Copy-Item (Join-Path $maps 'manifest.json') "$srv\mapa\manifest.json"
          Copy-Item 'services\tile_service\src' "$srv\tiles\src" -Recurse
          Copy-Item 'services\tile_service\package.json' "$srv\tiles\package.json"
          Copy-Item 'apps\flutter_client\windows\servidor\mapa\LEEME-MAPAS.txt' "$srv\mapa\LEEME-MAPAS.txt"
          Copy-Item 'datos\ejemplo\*' "$rel\datos_ejemplo\"
          $sz = [math]::Round((Get-ChildItem $srv -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "servidor/ montado: $sz MB"

      - name: Empaquetar ZIP portable
        run: |
          $ver = '${{ inputs.version }}'; if (-not $ver) { $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value }
          $rel = 'build\windows\x64\runner\Release'
          foreach ($f in 'lexair_geo.exe','flutter_windows.dll','data\icudtl.dat','data\app.so','servidor\node\node.exe','servidor\pg\bin\postgres.exe','servidor\api\dist\index.js') {
            if (-not (Test-Path (Join-Path $rel $f))) { throw "Falta $f en el paquete" } }
          Copy-Item ..\..\infrastructure\windows\config.example.json (Join-Path $rel 'config.example.json')
          New-Item -ItemType Directory -Force ..\..\out | Out-Null
          if ('${{ inputs.diagnostico }}' -ne 'true') {
            Compress-Archive -Path "$rel\*" -DestinationPath "..\..\out\Vigia-$ver-windows-x64-portable.zip" -Force
          }
          "VERSION=$ver" | Out-File -Append $env:GITHUB_ENV

      - name: Instaladores offline (Inno Setup) · Cliente / Servidor / TodoEnUno
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup --version=6.7.1 -y --no-progress; $env:Path += ';C:\Program Files (x86)\Inno Setup 6' }
          $rel = "$PWD\build\windows\x64\runner\Release"
          # Stage del programa SIN servidor (robocopy /XD): el servidor entra
          # solo por su propia entrada de [Files], según el rol elegido.
          $stage = Join-Path $env:RUNNER_TEMP 'stage-app'
          robocopy $rel $stage /E /XD "$rel\servidor" /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy falló con código $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          $man = Join-Path $env:RUNNER_TEMP 'manifiestos'
          # Manifiesto SHA-256 (sha en minúsculas + dos espacios + ruta relativa),
          # uno por modo y SIEMPRE con el nombre manifiesto.txt (lo extrae el instalador).
          function Gen-Manifiesto([string]$Root, [string]$Dest) {
            $archivos = Get-ChildItem -LiteralPath $Root -Recurse -File | Sort-Object FullName
            $lineas = foreach ($f in $archivos) {
              $relativa = $f.FullName.Substring($Root.Length + 1)
              "{0}  {1}" -f (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower(), $relativa
            }
            $carpeta = Split-Path $Dest -Parent
            New-Item -ItemType Directory -Force $carpeta | Out-Null
            $lineas | Set-Content -LiteralPath $Dest -Encoding ascii
          }
          Gen-Manifiesto $stage (Join-Path $man 'cliente\manifiesto.txt')
          Gen-Manifiesto $rel (Join-Path $man 'servidor\manifiesto.txt')
          Gen-Manifiesto $rel (Join-Path $man 'todo\manifiesto.txt')
          # Tres instaladores desde un mismo script
          if ('${{ inputs.diagnostico }}' -ne 'true') {
            iscc.exe /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$stage" "/DOutDir=$PWD\..\..\out" "/DModo=cliente" "/DManifiestoFile=$(Join-Path $man 'cliente\manifiesto.txt')" windows\installer\lexair_geo.iss
            if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador: $LASTEXITCODE" }
          }
          iscc.exe /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$stage" "/DServidorDir=$rel\servidor" "/DOutDir=$PWD\..\..\out" "/DModo=servidor" "/DManifiestoFile=$(Join-Path $man 'servidor\manifiesto.txt')" windows\installer\lexair_geo.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador: $LASTEXITCODE" }
          if ('${{ inputs.diagnostico }}' -ne 'true') {
            iscc.exe /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$stage" "/DServidorDir=$rel\servidor" "/DOutDir=$PWD\..\..\out" "/DModo=todo" "/DManifiestoFile=$(Join-Path $man 'todo\manifiesto.txt')" windows\installer\lexair_geo.iss
            if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador: $LASTEXITCODE" }
          }

      - name: Preparar diagnóstico de bibliotecas
        run: python -m pip install pefile==2024.8.26
      - name: Prueba del instalador, arranque y acceso (Windows)
        working-directory: ${{ github.workspace }}
        run: ./scripts/windows/smoke-install.ps1
      - name: Probar el ZIP portable descomprimido
        if: ${{ !inputs.diagnostico }}
        working-directory: ${{ github.workspace }}
        run: ./scripts/windows/smoke-portable.ps1
      - name: Capturar bienvenida del instalador
        working-directory: ${{ github.workspace }}
        run: ./scripts/windows/capture-installer.ps1
      - name: Guardar captura de diagnóstico si está disponible
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigia-pantalla-windows
          path: |
            ${{ runner.temp }}/vigia-ci-pantalla.png
            ${{ runner.temp }}/vigia-ci-mapa.png
            ${{ runner.temp }}/vigia-setup-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Sumas SHA-256
        working-directory: out
        run: Get-ChildItem *.zip,*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lexair-geo-windows${{ inputs.version && format('-{0}', inputs.version) || '' }}
          path: out/
          retention-days: 30
