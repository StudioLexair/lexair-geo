# LEXAIR GEO · Integración continua: análisis, pruebas unitarias y compilación.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      portable_run:
        description: 'Opcional: ejecución Windows con ZIP portable para probar'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: 26.13.1
  FLUTTER_VERSION: 3.50.1

jobs:
  api:
    name: API (lint, tipos, unitarias, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/unit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  tile-service:
    name: Servidor de mosaicos
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/tile_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run lint
      - run: npm test

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter_client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Pruebas Flutter
        timeout-minutes: 6
        run: flutter test --timeout 60s

  scripts:
    name: Scripts (shellcheck, Python, SQL de mapas)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning scripts/*.sh scripts/maps/*.sh scripts/build/*.sh
      - run: python3 -m py_compile scripts/maps/lexair_styles.py scripts/maps/render_mbtiles.py
      - name: Sin secretos ni datos pesados versionados
        run: |
          set -e
          if git ls-files | grep -Ei '\.(pbf|mbtiles|dump|pem|key|p12|pfx|sqlite|db)$|(^|/)\.env$'; then
            echo "::error::Hay archivos prohibidos en el repositorio"; exit 1; fi
          if git grep -nIE '(ghp_|github_pat_)[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!docs/SECURITY.md'; then
            echo "::error::Posible secreto en el código"; exit 1; fi

  portable-windows:
    name: Prueba del ZIP portable Windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.portable_run }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lexair-geo-windows
          run-id: ${{ inputs.portable_run }}
          github-token: ${{ github.token }}
          path: out
      - name: Arranque, acceso y mapa en portable
        shell: pwsh
        run: ./scripts/windows/smoke-portable.ps1
      - name: Captura del portable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigia-portable-pantalla
          path: ${{ runner.temp }}/vigia-portable.png
          if-no-files-found: ignore
          retention-days: 7
